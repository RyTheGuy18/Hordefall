<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<meta name="description" content="Zombie survival shooter. Survive the night, solo or with friends.">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--haz:#facc15;--blood:#dc2626;--bg:#060706;--pan:#1a1f15;--pan2:#11140e;--line:#3d4a2c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#ecebdf;font-family:Rubik,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
canvas.aim{cursor:crosshair}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{user-select:text;-webkit-user-select:text}
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.15em;flex:none}
.so{font-family:'Black Ops One',Impact,sans-serif;font-weight:400}
#hud{position:fixed;top:env(safe-area-inset-top,0);right:env(safe-area-inset-right,0);bottom:env(safe-area-inset-bottom,0);left:env(safe-area-inset-left,0);pointer-events:none;display:none}
#xpbar{position:absolute;top:0;left:0;right:0;height:14px;background:#0d100b;border-bottom:2px solid #000;overflow:hidden}
#xpfill{height:100%;width:0;background:linear-gradient(90deg,#65a30d,#a3e635,#facc15);box-shadow:0 0 14px #a3e635;transition:width .1s}
#tl{position:absolute;top:22px;left:12px}
#lvl{font-family:'Black Ops One',Impact;font-size:22px;text-shadow:0 2px 0 #000,0 0 12px #65a30d;color:#d9f99d}
#party{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.pp{display:flex;flex-direction:column;gap:3px}
.ph{display:flex;align-items:center;gap:6px;font-family:'Black Ops One',Impact;font-size:13px;text-shadow:0 1px 0 #000}
.hpb{width:90px;height:7px;background:#000a;border-radius:3px;overflow:hidden;border:1px solid #000}
.hpb i{display:block;height:100%;background:#4ade80;width:100%}
.pp.down .hpb i{background:#64748b}
.pp.down .ph::after{content:'DOWN';color:#f87171;font-size:11px}
.slots{display:flex;flex-wrap:wrap;gap:5px;max-width:260px}
.slot{width:34px;height:34px;border-radius:6px;background:#141810d0;border:2px solid #3d4a2c;display:grid;place-items:center;font-size:20px;position:relative;overflow:hidden}
.slot b{position:absolute;right:1px;bottom:0;font-size:9px;font-family:'Black Ops One',Impact;color:#fde68a;font-weight:400;text-shadow:0 1px 0 #000}
.slot .rl{position:absolute;left:0;right:0;bottom:0;background:#dc262688;height:0}
.slot.evo{border-color:var(--haz);box-shadow:0 0 10px #facc15aa}
.slot.p{border-color:#334155}
.multi .slot{width:24px;height:24px;font-size:14px;border-width:1.5px}
.multi .slot b{font-size:8px}
.multi .slots{gap:3px;max-width:340px}
.sep{flex-basis:100%;height:0}
.multi .sep{flex-basis:auto;width:4px}
#timer{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center;font-family:'Black Ops One',Impact;font-size:34px;text-shadow:0 3px 0 #000,0 0 16px #000;line-height:1}
#timer small{display:block;font-family:Rubik;font-weight:800;font-size:10px;letter-spacing:.2em;opacity:.7;margin-top:4px}
#timer.danger{color:#f87171;animation:pulse .5s infinite alternate}
#tr{position:absolute;top:22px;right:12px;text-align:right;font-family:'Black Ops One',Impact;font-size:18px;text-shadow:0 2px 0 #000}
#tr>div{margin-bottom:4px;display:flex;gap:6px;align-items:center;justify-content:flex-end}
#pausebtn{pointer-events:auto;margin-top:2px;width:42px;height:42px;border-radius:8px;background:#141810d0;border:2px solid #3d4a2c;font-family:'Black Ops One',Impact;font-size:15px}
#combo{position:absolute;right:14px;top:150px;text-align:right;opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#combon{font-family:'Black Ops One',Impact;font-size:40px;line-height:1;color:#fca5a5;text-shadow:0 3px 0 #7f1d1d,0 0 18px #dc2626}
#combon.pop{animation:cpop .2s}
#combol{font-weight:800;font-size:12px;color:#fecaca;text-shadow:0 1px 0 #000;margin-top:2px}
#combobar{width:110px;height:5px;background:#0009;border-radius:3px;margin:5px 0 0 auto;overflow:hidden}
#combobar i{display:block;height:100%;background:linear-gradient(90deg,#7f1d1d,#ef4444);width:100%}
#cban{position:absolute;right:14px;top:228px;font-family:'Black Ops One',Impact;font-size:18px;color:#fca5a5;text-shadow:0 2px 0 #000;opacity:0;text-align:right}
#cban.go{animation:cban 1.5s ease-out}
#boss{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:min(560px,86vw);display:none;text-align:center}
#bossname{font-family:'Black Ops One',Impact;color:#f87171;text-shadow:0 2px 0 #000;margin-bottom:4px;letter-spacing:.08em;font-size:18px}
#bossbar{height:16px;background:#1a0606;border:2px solid #000;overflow:hidden;box-shadow:0 0 20px #dc262666}
#bossbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,#b91c1c 0 10px,#dc2626 10px 20px);width:100%;transition:width .12s}
#banner{position:absolute;top:26%;left:0;right:0;text-align:center;font-family:'Black Ops One',Impact;font-size:clamp(28px,6.5vw,62px);opacity:0;text-shadow:0 4px 0 #000,0 0 30px currentColor;padding:0 10px;letter-spacing:.04em}
#banner.go{animation:ban 2.5s ease-out}
#toasts{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#141810f2;border:2px solid var(--haz);padding:8px 16px;border-radius:6px;font-weight:800;animation:tin .3s,tout .4s 2.8s forwards;box-shadow:0 6px 20px #000a;white-space:nowrap;display:flex;gap:8px;align-items:center}
#ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0a0c08c0,#030402ec);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0)) calc(14px + env(safe-area-inset-right,0)) calc(24px + env(safe-area-inset-bottom,0)) calc(14px + env(safe-area-inset-left,0));touch-action:pan-y}
#ov.on{display:flex}
#ov.menubg{background:radial-gradient(ellipse at center,#0a0c0840,#030402c8);backdrop-filter:none;-webkit-backdrop-filter:none}
#ov>div{margin:auto;max-width:100%}
.btn{background:linear-gradient(#2b3322,#1a1f14);border:2px solid #4d5a36;border-bottom-width:5px;border-radius:8px;padding:12px 22px;font-weight:800;font-size:17px;transition:transform .08s,filter .15s;color:#ecebdf;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-transform:uppercase;letter-spacing:.04em}
.btn:hover{filter:brightness(1.25);transform:translateY(-2px)}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.big{font-family:'Black Ops One',Impact;font-weight:400;font-size:26px;padding:14px 42px;background:repeating-linear-gradient(-45deg,#facc15 0 18px,#eab308 18px 36px);color:#111;border-color:#713f12;box-shadow:0 0 30px #facc1544;text-shadow:0 1px 0 #fde68a}
.btn.daily{background:linear-gradient(#7f1d1d,#450a0a);border-color:#2a0505;flex-direction:column;gap:2px}
.btn.sm{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn small{display:block;font-size:11px;font-weight:600;opacity:.85;text-transform:none;letter-spacing:0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hint{font-size:13px;opacity:.6;text-align:center;margin-top:14px}
.menu{text-align:center;display:flex;flex-direction:column;align-items:center}
.logo{font-family:'Black Ops One',Impact;font-size:clamp(54px,15vw,140px);line-height:.9;letter-spacing:.02em}
.logo .a{color:#dc2626;text-shadow:0 0 40px #dc262699,4px 4px 0 #2a0505;display:block;animation:flick 4s infinite}
.logo .b{color:#ecebdf;text-shadow:4px 4px 0 #000;display:block}
.tag{margin:16px 0 26px;font-weight:800;opacity:.75;letter-spacing:.3em;text-transform:uppercase;font-size:13px}
.mbtns{display:flex;flex-direction:column;gap:12px;width:min(340px,88vw)}
.mbtns .btn{width:100%}
.mbtns .row .btn{flex:1}
.mstats{margin-top:20px;font-weight:600;opacity:.75;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.mute{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0));right:calc(14px + env(safe-area-inset-right,0));font-size:24px;width:48px;height:48px;border-radius:8px;background:#141810d0;border:2px solid #3d4a2c;z-index:25;display:grid;place-items:center}
.scr{width:min(920px,100%);text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.top h2{font-family:'Black Ops One',Impact;font-weight:400;font-size:clamp(20px,4.5vw,34px);text-shadow:0 3px 0 #000;display:flex;gap:10px;align-items:center;letter-spacing:.04em}
.gpill{font-family:'Black Ops One',Impact;background:#141810;border:2px solid #4d5a36;border-radius:8px;padding:8px 12px;color:#bef264;white-space:nowrap;display:flex;gap:6px;align-items:center}
.crew{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.slotc{background:linear-gradient(160deg,#20271a,#0f120c);border:3px solid var(--t);border-radius:10px;padding:14px 10px;position:relative;box-shadow:0 0 24px color-mix(in srgb,var(--t) 30%,transparent);animation:cin .3s backwards}
.slotc .pt{font-family:'Black Ops One',Impact;color:var(--t);font-size:22px;text-shadow:0 2px 0 #000}
.slotc .kick{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:6px;background:#0006;display:grid;place-items:center;font-size:16px;opacity:.7}
.slotc .kick:hover{opacity:1}
.cyc{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0 6px}
.cyc button{width:34px;height:34px;border-radius:6px;background:#141810;border:2px solid #4d5a36;font-family:'Black Ops One',Impact;font-size:16px}
.av{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:radial-gradient(circle at 35% 30%,#ffffff40,transparent 60%),var(--c);border:3px solid #000a;box-shadow:0 0 18px color-mix(in srgb,var(--c) 60%,transparent);color:#0b0b0b;flex:none}
.cn{font-family:'Black Ops One',Impact;font-size:17px;letter-spacing:.03em}
.cp{font-size:13px;opacity:.85;margin-top:4px;min-height:34px}
.ctl{font-size:12px;font-weight:700;opacity:.8;margin-top:8px;display:flex;gap:5px;align-items:center;justify-content:center;background:#0006;border-radius:6px;padding:5px}
.empty{border:3px dashed #3d4a2c;border-radius:10px;padding:14px 10px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;min-height:230px;color:#a8b38f}
.empty .jt{font-family:'Black Ops One',Impact;font-size:18px;color:#bef264}
.empty .btn{width:100%;font-size:12px;padding:8px}
.empty small{font-size:12px;opacity:.8}
.locks{margin-top:14px;font-size:13px;opacity:.75;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.locks span{display:inline-flex;gap:5px;align-items:center}
.asc{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0}
.asc button{font-size:20px;width:44px;height:44px;border-radius:6px;background:#141810;border:2px solid #4d5a36;font-family:'Black Ops One',Impact}
.asc b{font-family:'Black Ops One',Impact;font-weight:400;font-size:20px;color:#f87171;display:block}
.asc small{opacity:.75}
.forge{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;text-align:left}
.fu{background:linear-gradient(160deg,#20271a,#0f120c);border:2px solid #3d4a2c;border-radius:10px;padding:12px;display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:center}
.fu.flash{animation:fflash .5s}
.fu .fi{font-size:32px;grid-row:span 3;text-align:center}
.fu .fn{font-weight:800}
.fu .fd{font-size:13px;opacity:.75}
.pips{display:flex;gap:3px}
.pips i{width:14px;height:6px;border-radius:1px;background:#2b3322}
.pips i.on{background:var(--haz);box-shadow:0 0 6px #facc15}
.fu .btn{grid-column:1/-1;margin-top:6px;padding:8px;font-size:15px}
.codex h3{font-family:'Black Ops One',Impact;font-weight:400;margin:18px 0 10px;text-align:left;color:#bef264;letter-spacing:.04em}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.cx{background:#11140e;border:2px solid #2b3322;border-radius:8px;padding:10px;text-align:left;display:flex;gap:10px;align-items:center}
.cx .ci{font-size:28px;display:grid}
.cx .cn2{font-weight:800;font-size:14px}
.cx .cd{font-size:11px;opacity:.75}
.cx.un{opacity:.4}
.cx.evo{border-color:#854d0e}
.lu{text-align:center}
.lu h1{font-family:'Black Ops One',Impact;font-weight:400;font-size:clamp(38px,9vw,70px);color:#facc15;text-shadow:0 5px 0 #713f12,0 0 40px #eab308;animation:lupop .45s cubic-bezier(.2,1.6,.4,1)}
.who{font-family:'Black Ops One',Impact;font-size:22px;margin-top:6px;text-shadow:0 2px 0 #000}
.lusub{font-weight:800;opacity:.8;margin-top:4px}
.cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.card{width:212px;min-height:240px;background:linear-gradient(160deg,#232b1c,#10130d);border:3px solid #3d4a2c;border-radius:10px;padding:18px 14px;text-align:center;position:relative;overflow:hidden;cursor:pointer;animation:cin .38s cubic-bezier(.2,1.4,.4,1) backwards;transition:transform .12s,border-color .12s}
.card:hover,.card.focus{transform:translateY(-6px) scale(1.03);border-color:#fff}
.card .ic{font-size:56px;margin:4px 0 8px;filter:drop-shadow(0 4px 10px #000);display:grid;place-items:center}
.card .nm{font-family:'Black Ops One',Impact;font-size:18px;letter-spacing:.02em}
.card .lv{font-size:12px;font-weight:800;color:#bef264;margin:4px 0 8px}
.card .ds{font-size:14px;color:#e7e5d6;line-height:1.35}
.card .ev{margin-top:10px;font-size:12px;color:#fde68a;font-weight:700;display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap}
.card .new{position:absolute;top:12px;right:-30px;transform:rotate(35deg);background:#dc2626;color:#fff;font-weight:800;font-size:11px;padding:2px 34px}
.card .key{position:absolute;top:8px;left:11px;font-family:'Black Ops One',Impact;font-size:13px;opacity:.45}
.card.r-new{border-color:#b91c1c;box-shadow:0 0 24px #dc262644}
.card.r-gold{border-color:#facc15;box-shadow:0 0 30px #facc1566}
.card.focus{box-shadow:0 0 0 3px #fff4,0 0 34px #fff3}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff18 50%,transparent 60%);transform:translateX(-120%);animation:shine 2.6s infinite;pointer-events:none}
.chest{text-align:center}
.chest h1{font-family:'Black Ops One',Impact;font-weight:400;font-size:clamp(34px,8vw,62px);color:#bef264;text-shadow:0 5px 0 #365314,0 0 40px #65a30d;animation:lupop .45s cubic-bezier(.2,1.6,.4,1)}
.reels{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:24px 0 10px}
.rw{width:104px}
.reel{width:100px;height:112px;border:3px solid #4d5a36;border-radius:8px;background:linear-gradient(#1a1f14,#0b0d08);display:grid;place-items:center;font-size:56px;box-shadow:inset 0 0 20px #000}
.reel.spin{animation:rspin .1s infinite}
.reel.done{animation:rpop .35s cubic-bezier(.2,1.8,.4,1);border-color:#bef264;box-shadow:0 0 22px #a3e63588,inset 0 0 20px #000}
.reel.evo{background:radial-gradient(#fde047,#a16207);box-shadow:0 0 50px #facc15;border-color:#facc15}
.rn{font-size:12px;font-weight:800;margin-top:6px;min-height:30px;color:#d9f99d}
.cgold{font-family:'Black Ops One',Impact;font-size:30px;color:#bef264;text-shadow:0 3px 0 #000;margin:8px 0 18px;display:flex;gap:8px;align-items:center;justify-content:center}
.go{width:min(680px,100%);text-align:center}
.go h1{font-family:'Black Ops One',Impact;font-weight:400;font-size:clamp(44px,11vw,86px);animation:lupop .5s cubic-bezier(.2,1.6,.4,1)}
.go h1.dead{color:#dc2626;text-shadow:0 6px 0 #450a0a,0 0 40px #dc2626}
.go h1.win{color:#fde68a;text-shadow:0 6px 0 #9a3412,0 0 50px #fb923c}
.sub{opacity:.75;font-weight:600;margin-bottom:16px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.st{background:#11140e;border:2px solid #2b3322;border-radius:8px;padding:10px 4px;position:relative}
.st b{display:block;font-family:'Black Ops One',Impact;font-weight:400;font-size:22px}
.st span{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.08em}
.st em{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#facc15;color:#000;font-style:normal;font-weight:800;font-size:9px;padding:2px 6px;border-radius:3px;white-space:nowrap;animation:pulse .5s infinite alternate}
.dmg{background:#11140e;border:2px solid #2b3322;border-radius:8px;padding:10px 12px;margin-bottom:14px;text-align:left}
.dr{display:grid;grid-template-columns:24px 1fr 70px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.dr>span:first-child{font-size:18px;display:grid}

.partyr{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px}

.pc .pt{font-family:'Black Ops One',Impact;color:var(--t);font-size:18px}
.pc .mv{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:#facc15;color:#000;font-weight:800;font-size:11px;padding:2px 8px;border-radius:4px;display:flex;gap:4px;align-items:center;white-space:nowrap}
.pc .ps{font-size:13px;margin-top:6px;line-height:1.5}

.pc .pw{font-size:20px;margin-top:6px;display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.earn{font-family:'Black Ops One',Impact;font-size:34px;color:#bef264;text-shadow:0 3px 0 #000;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}

.board{background:#11140e;border:2px solid #2b3322;border-radius:8px;padding:12px;margin:12px 0;text-align:left}
.board h3{font-family:'Black Ops One',Impact;font-weight:400;font-size:15px;margin-bottom:8px;color:#bef264}
.br{display:grid;grid-template-columns:30px 1fr auto;gap:8px;padding:5px 6px;border-radius:4px;font-weight:600}
.br.me{background:#facc1522;color:#fde68a}
.br .rk{font-family:'Black Ops One',Impact}
.dcard{background:linear-gradient(160deg,#450a0a,#11140e);border:2px solid #b91c1c;border-radius:10px;padding:18px;margin-bottom:12px}
.dch{font-size:20px;font-weight:800;margin:8px 0;display:flex;gap:10px;align-items:center;justify-content:center}
.dch .av{width:46px;height:46px;font-size:24px}

function zig(x0,y0,x1,y1){const pts=[[x0,y0]];const n=7;for(let i=1;i<n;i++){const t=i/n;pts.push([lerp(x0,x1,t)+rnd(-12,12),lerp(y0,y1,t)+rnd(-12,12)])}pts.push([x1,y1]);return pts}

const CELL=64;const grid=new Map();
const gkey=(cx,cy)=>(cx+32768)*65536+(cy+32768);
function buildGrid(){grid.clear();for(const e of enemies){if(e.dead)continue;const k=gkey(Math.floor(e.x/CELL),Math.floor(e.y/CELL));let a=grid.get(k);if(!a){a=[];grid.set(k,a)}a.push(e)}}
function query(x,y,r,fn){const x0=Math.floor((x-r-60)/CELL),x1=Math.floor((x+r+60)/CELL),y0=Math.floor((y-r-60)/CELL),y1=Math.floor((y+r+60)/CELL);for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const a=grid.get(gkey(cx,cy));if(!a)continue;for(let i=0;i<a.length;i++){const e=a[i];if(e.dead)continue;const dx=e.x-x,dy=e.y-y,rr=r+e.r;if(dx*dx+dy*dy<rr*rr)fn(e)}}}
function nearestN(p,n,maxD){const best=[];const m2=maxD*maxD;for(const e of enemies){if(e.dead)continue;const dx=e.x-p.x,dy=e.y-p.y,d2=dx*dx+dy*dy;if(d2>m2)continue;if(best.length<n){best.push([d2,e]);best.sort((a,b)=>a[0]-b[0])}else if(d2<best[n-1][0]){best[n-1]=[d2,e];best.sort((a,b)=>a[0]-b[0])}}return best.map(b=>b[1])}
function onScreen(e,m=0){return Math.abs(e.x-cam.x)<VW/2/camZ+m&&Math.abs(e.y-cam.y)<VH/2/camZ+m}
function nearestPlayer(x,y){let b=null,bd=1e18;for(const p of PS){if(p.down)continue;const d=(p.x-x)**2+(p.y-y)**2;if(d<bd){bd=d;b=p}}return b}

function gunTarget(p,range){const t=nearestN(p,1,range);return t[0]||null}
function updateWeapon(p,w,dt){const id=w.id,s=ws(p,w),o=p.idx;
 if(GUNS[id]){if(w.ammo==null)w.ammo=s.mag;
  if(w.rl>0){w.rl-=dt;w.rlT=s.rl;if(w.rl<=0){w.ammo=s.mag;sfx.reload()}return}
  w.t-=dt;if(w.t>0)return;
  let a;if(p.manual)a=p.aimA;else{const range=s.spd*s.life*.95;const tg=gunTarget(p,range);if(!tg){w.t=.05;return}a=Math.atan2(tg.y-p.y,tg.x-p.x);p.aimA=a;p.aimT=.6}
  fireGun(p,w,s,a);w.ammo--;w.t=s.cd;if(w.ammo<=0){w.rl=s.rl;w.rlT=s.rl}return}
 if(id==='saw'||id==='shredder'){w.ang=(w.ang||0)+s.rot*dt;w.r=s.r;w.n=s.n;const br=(id==='shredder'?24:18)*Math.sqrt(p.area);const ck=id+o;
  for(let k=0;k<s.n;k++){const a=w.ang+k*TAU/s.n,bx=p.x+Math.cos(a)*s.r,by=p.y+Math.sin(a)*s.r;
   query(bx,by,br,e=>{if((e.cool[ck]||0)>G.time)return;e.cool[ck]=G.time+.3;hurt(e,s.dmg,id,Math.cos(a+1.57),Math.sin(a+1.57),o);if(Math.random()<.5)burst(bx,by,'#fde68a',3,200,.6)})}
  if(id==='shredder'){for(const g of gems){if(!g.fly){const dx=g.x-p.x,dy=g.y-p.y;if(dx*dx+dy*dy<420*420){g.fly=1;g.tp=p}}}}
  return}
 w.t-=dt;if(w.t>0)return;w.t=s.cd;
 if(id==='launcher'||id==='mortar')fireBomb(p,w,s);else if(id==='molotov'||id==='napalm')fireMolotov(p,w,s);else if(id==='tesla'||id==='arc')fireTesla(p,w,s)}
function fireGun(p,w,s,a){const id=w.id;const gx=p.x+Math.cos(a)*20,gy=p.y+Math.sin(a)*20;
 for(let i=0;i<s.n;i++){let b=a;if(s.n>1)b+=(id==='shotgun'||id==='dragon')?(i/(s.n-1)-.5)*s.spr+rnd(-.05,.05):(i-(s.n-1)/2)*.09;b+=rnd(-1,1)*((id==='shotgun'||id==='dragon')?.03:s.spr*.5);
  const sp=s.spd*rnd(.92,1.08);proj.push({x:gx,y:gy,px:gx,py:gy,vx:Math.cos(b)*sp,vy:Math.sin(b)*sp,dmg:s.dmg,pierce:s.pierce,r:id==='cannon'?8:5,life:s.life*rnd(.9,1.1),col:id==='dragon'?'#fb923c':id==='cannon'?'#fde68a':'#fef3c7',wid:id,o:p.idx,hit:new Set(),kb:s.kb||1,burn:s.burn||0,w:id==='cannon'?4:id==='minigun'?2.5:2})}
 addFlash({x:gx,y:gy,a,t:0,T:id==='smg'||id==='minigun'?.05:.08,big:id==='shotgun'||id==='dragon'||id==='cannon'});
 if(Math.random()<.9&&parts.length<800){const sa=a+Math.PI/2*(Math.random()<.5?1:-1)+rnd(-.3,.3);parts.push({x:p.x,y:p.y,vx:Math.cos(sa)*rnd(80,150),vy:Math.sin(sa)*rnd(80,150),l:.6,ml:.6,c:id==='shotgun'||id==='dragon'?'#b91c1c':'#d4a72c',s:3,shell:1,rot:Math.random()*6})}
 p.kick=1;p.aimA=a;sfx.gun(id);if(id==='shotgun'||id==='dragon'||id==='cannon')shake(.06)}

   <div class="cyc">${i===me?'<button data-a="netCyc" data-d="-1">&lt;</button>':''}<div class="av" style="--c:${c.col}">${iIco(c.w)}</div>${i===me?'<button data-a="netCyc" data-d="1">&gt;</button>':''}</div><div class="cn">${c.name}</div><div class="cp">${c.perk}<br><span style="opacity:.6;font-size:11px">${ITEMS[c.w].name}</span></div></div>`}
  else slots+=`<div class="empty" style="min-height:220px"><div class="jt">P${i+1}</div><small>Waiting for a player...</small></div>`}
 show(`<div class="scr"><div class="top"><button class="btn sm" data-a="netLeave">&larr; Leave</button><h2>${ico('users')} LOBBY</h2><div class="gpill">${ico('cash','#86efac')} $${fmt(S.gold)}</div></div>
 <div class="codebox"><small>LOBBY CODE</small><b>${esc(NET.code)}</b>${host?`<div class="row"><button class="btn sm" data-a="shareCode">${ico('users')} Send code</button><button class="btn sm" data-a="copyCode">${ico('copy')} Copy</button></div><div class="hint" style="margin-top:2px;color:#fde68a;opacity:1;font-weight:700">Keep Hordefall open on this screen until everyone joins. Switching apps can pause your lobby.</div>`:''}<div class="hint" style="margin-top:2px">Friends open Hordefall &rarr; Online &rarr; type this code</div></div>
 <div class="crew">${slots}</div>
 ${host?`<div class="asc">${S.asc>0?`<button data-a="ascm">&lt;</button><div><b>${selAsc?'NIGHTMARE '+selAsc:'NORMAL'}</b><small>${selAsc?`Zombies +${selAsc*15}% HP · Cash +${selAsc*20}%`:'Standard difficulty'}</small></div><button data-a="ascp">&gt;</button>`:'<small style="opacity:.7">Kill Patient Zero to unlock Nightmare difficulty</small>'}</div><button class="btn big" data-a="netStart">START ${ico('play')}</button><div class="hint">You can start alone, or wait for friends to join.</div>`:`<div class="hint" style="font-size:16px;opacity:.85;margin-top:22px">${selAsc?'Nightmare '+selAsc+' · ':''}Waiting for the host to start...</div>`}</div>`,'','lobby');
 ovKey=e=>{if(host&&e.key==='Enter')A.netStart();else if(e.key==='Escape')A.netLeave();else if(e.code!=='pad'&&(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'))A.netCyc({d:-1});else if(e.code!=='pad'&&(e.key==='ArrowRight'||e.key==='d'||e.key==='D'))A.netCyc({d:1})}}
Object.assign(A,{
 online:()=>showOnline(),netHost:()=>hostLobby(),netJoin:()=>joinLobby(),netStart:()=>netStart(),
 netLeave:()=>{if(NET.role==='host')sendAll({t:'closed'});else if(NET.role==='client')nsend(NET.hostConn,{t:'bye'});const r=NET.role;setTimeout(()=>{netCleanup()},r==='host'?150:50);state='menu';G=null;PS=[];showOnline()},
 netKick:d=>{const ent=[...NET.conns.values()][(+d.i)-1];if(!ent)return;nsend(ent.conn,{t:'kick'});NET.conns.delete(ent.id);setTimeout(()=>{try{ent.conn.close()}catch(_){}},200);showLobby();lobbyBroadcast()},
 netCyc:d=>{const u=unlocked();const k=u.indexOf(NET.myCh);NET.myCh=u[(k+(+d.d)+u.length)%u.length];sfx.click();if(NET.role==='host'){lobbyBroadcast()}else{nsend(NET.hostConn,{t:'ch',ch:NET.myCh});if(NET.lobby[NET.myIdx])NET.lobby[NET.myIdx].ch=NET.myCh}showLobby()},
 copyCode:()=>{try{navigator.clipboard.writeText(NET.code).then(()=>toast(ico('copy')+' Code copied: '+NET.code),()=>toast('Code: '+NET.code))}catch(e){toast('Code: '+NET.code)}},
 shareCode:()=>{const txt=`Join my Hordefall lobby! Code: ${NET.code}`,url=location.origin+location.pathname;if(navigator.share){navigator.share({title:'Hordefall',text:txt,url}).catch(()=>{})}else A.copyCode()},
 netLobby:()=>{NET.started=false;state='menu';G=null;PS=[];showLobby();lobbyBroadcast()}
});

/* ---- keep the matchmaking link alive (iPhone pauses apps in the background) ---- */
function peerKeepAlive(){const p=NET.peer;if(!p||p.destroyed||!NET.role)return;if(p.disconnected){try{p.reconnect()}catch(_){}}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)peerKeepAlive()});addEventListener('focus',peerKeepAlive);addEventListener('pageshow',peerKeepAlive);setInterval(peerKeepAlive,4000);

/* ================= INSTALLABLE APP ================= */
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e});
addEventListener('appinstalled',()=>{installEvt=null;toast(ico('home')+' Hordefall installed! Open it from your home screen.');if(scr==='menu')showMenu()});
function isApp(){try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true}catch(e){return false}}
function showInstall(){const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua)||(ua.includes('Mac')&&'ontouchend' in document),android=/Android/.test(ua);
 const steps=ios?['Open this page in <b>Safari</b>','Tap the <b>Share</b> button (square with an arrow)','Tap <b>Add to Home Screen</b>, then <b>Add</b>']:android?['Open this page in <b>Chrome</b>','Tap the <b>⋮</b> menu (top right)','Tap <b>Install app</b> or <b>Add to Home screen</b>']:['Use <b>Chrome</b> or <b>Edge</b>','Click the <b>install icon</b> at the right end of the address bar','Or open the browser menu and choose <b>Install Hordefall</b>'];
 show(`<div class="scr" style="max-width:520px"><div class="top"><button class="btn sm" data-a="menu">&larr;</button><h2>${ico('home')} INSTALL</h2><div></div></div>
 <div class="dcard" style="background:linear-gradient(160deg,#1a2a12,#11140e);border-color:#4d7c0f;text-align:left">${steps.map((t,i)=>`<div style="display:flex;gap:12px;align-items:center;margin:10px 0"><b class="so" style="font-size:26px;color:#facc15;width:26px">${i+1}</b><span style="font-size:16px">${t}</span></div>`).join('')}</div>
 <div class="hint">After installing, Hordefall gets its own icon, opens full screen, and works offline for solo and same-screen play. Online lobbies still need internet.</div></div>`,'','install');
 ovKey=e=>{if(e.key==='Escape')showMenu()}}
A.install=()=>{if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null})}else showInstall()};
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}})}

/* ================= LOOP ================= */
let last=performance.now();
function frame(now){const rdt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
 try{pollPads();
 if(NET.role==='client'&&state==='play'&&G&&G.client){clientStep(rdt)}
 else if(state==='play'&&G&&!overlayOpen){let ts=1;
  if(G.luT>0){ts=.15;G.luT-=rdt;if(G.luT<=0&&!G.over){G.luT=0;if(G.picks.length>0)openLevelUp()}}
  if(G.vicT>0&&!overlayOpen){ts=.3;G.vicT-=rdt;if(G.vicT<=0){G.vicT=0;showVictory()}}
  if(G.over&&!overlayOpen){ts=.3;G.deathT-=rdt;if(G.deathT<=0)endRun(false)}
  if(!overlayOpen){if(freeze>0)freeze-=rdt;else update(rdt*ts)}
  if(!overlayOpen&&G.picks.length>0&&G.luT<=0&&!G.over&&G.vicT<=0)G.luT=.2;
 }else if(state!=='play'){stepFx(rdt)}
 if(NET.role==='host'&&state==='play'&&G&&NET.conns.size){NET.sendT+=rdt;if(NET.sendT>=NET.snapInt){NET.sendT=0;sendSnapAll(buildSnap())}}else if(NET.role==='host')FX.length=0;
 render(rdt)}catch(err){console.error(err)}
 requestAnimationFrame(frame)}
showMenu();requestAnimationFrame(frame);
</script>
